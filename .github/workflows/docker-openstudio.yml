name: openstudio-docker

on: [push, pull_request]

# example of how to restrict to one branch and push event
#on:
#  push:
#    branches:
#      - test_branch

env:
  USE_TESTING_TIMEOUTS: "true"
  OPENSTUDIO_VERSION: 3.9.0
  OPENSTUDIO_SHA: c77fbb9569
  OPENSTUDIO_VERSION_EXT: ""
  DOWNLOAD_PREFIX: ""

permissions:
  contents: read
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.8.x'

    - name: test and build
      shell: bash
      run: |
          docker build -t openstudio:latest \
          --build-arg OPENSTUDIO_VERSION=$OPENSTUDIO_VERSION \
          --build-arg OPENSTUDIO_SHA=$OPENSTUDIO_SHA \
          --build-arg OPENSTUDIO_VERSION_EXT=$OPENSTUDIO_VERSION_EXT \
          --build-arg DOWNLOAD_PREFIX=$DOWNLOAD_PREFIX .
          docker run openstudio:latest openstudio openstudio_version
          docker run openstudio:latest /usr/local/openstudio-$OPENSTUDIO_VERSION/Radiance/bin/rtrace -version
          docker run -v $(pwd):/var/simdata/openstudio openstudio:latest ruby /var/simdata/openstudio/test/test_run.rb
          docker run -v $(pwd)/test:/var/simdata/openstudio openstudio:latest ./test_gemfile.sh

    - name: deploy docker
      if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/custom_branch_name') }}
      shell: bash
      run: ./deploy_docker.sh
      env:
        DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        DOCKER_USER: ${{ secrets.DOCKER_USER }}

  apptainer:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.8.x'

    - name: install apptainer
      shell: bash
      run: |
        sudo add-apt-repository -y ppa:apptainer/ppa
        sudo apt update
        sudo apt install -y apptainer

    - name: build apptainer
      shell: bash
      run: |
        # Define the output filename to ensure consistency across the workflow
        APPTAINER_FILENAME="OpenStudio-${OPENSTUDIO_VERSION}${OPENSTUDIO_VERSION_EXT}.${OPENSTUDIO_SHA}-Apptainer.sif"

        # Export the filename as a GitHub Actions environment variable for use in subsequent steps
        echo "APPTAINER_FILENAME=${APPTAINER_FILENAME}" >> $GITHUB_ENV

        echo "Building Apptainer image: ${APPTAINER_FILENAME}"

        # Build the Apptainer image from the Docker container
        apptainer build \
          "${APPTAINER_FILENAME}" \
          "docker://nrel/openstudio:${OPENSTUDIO_VERSION}${OPENSTUDIO_VERSION_EXT}" || {
            echo "Error: Apptainer build failed"
            exit 1
          }

        # Verify the file was created successfully
        if [ -f "${APPTAINER_FILENAME}" ]; then
          echo "Successfully built ${APPTAINER_FILENAME}"
          # Get file size for logging
          FILE_SIZE=$(du -h "${APPTAINER_FILENAME}" | cut -f1)
          echo "File size: ${FILE_SIZE}"
        else
          echo "Error: ${APPTAINER_FILENAME} was not created"
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      with:
        name: apptainer-image
        path: ${{ env.APPTAINER_FILENAME }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
        role-to-assume: arn:aws:iam::471211731895:role/OpenStudioGitHubActionsRole
        role-session-name: GitHubActions

    - name: Upload artifacts to AWS S3
      uses: usualdesigner/s3-artifact-upload@main
      with:
        bucket-name: openstudio-builds
        prefix: ${{ env.OPENSTUDIO_VERSION }}
        file: ${{ env.APPTAINER_FILENAME }}
